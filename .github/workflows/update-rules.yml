name: Update merged remote rules

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.json
      - scripts/merge.py
      - .github/workflows/update-rules.yml

permissions:
  contents: write

concurrency:
  group: publish-merged-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch and merge complete upstream files
        run: python3 scripts/merge.py
      - name: Publish all successfully merged files in one commit
        run: |
          git add -- rules upstream
          if git diff --cached --quiet; then
            echo 'No rule changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update merged public rule lists'
          git push origin HEAD:main
